# Raya attendance: https://__DOMAIN__  ->  API + dashboard on 127.0.0.1:8100.
# certbot adds the HTTPS (443) part and the redirect from http:// to https://.
# Only requests for this exact name come here; CargoTrace and rewjido are not affected.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 2m;          # check-ins and forms are small
    server_tokens off;

    location / {
        # Flood protection per IP address (zone defined in /etc/nginx/conf.d/attendance-ratelimit.conf).
        # Generous on purpose: a whole office may share one internet address during the 08:00 rush.
        limit_req zone=attendance_api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the real visitor, not a forwarded claim
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;                          # large report exports
    }
}

# Cloud build of the iPhone app for the App Store (no Mac needed) - see docs/21-ios-release.md.
# Started by hand from the Codemagic website. It builds and signs the .ipa and uploads it to
# App Store Connect / TestFlight (publishing block at the end).
workflows:
  ios-release:
    name: iOS release (App Store)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: mobile
    integrations:
      # The App Store Connect API key added in Codemagic > Team settings > Integrations,
      # saved under exactly this name.
      app_store_connect: Raya App Store Connect
    environment:
      flutter: 3.47.6
      xcode: latest
      groups:
        # Holds CERTIFICATE_PRIVATE_KEY (secret): the private key of the Apple Distribution
        # certificate. Added once in Codemagic > the app > Environment variables.
        - code-signing
      vars:
        API_BASE_URL: https://raya.34.35.174.159.nip.io/api/v1
        BUNDLE_ID: com.raya.attendance
    scripts:
      - name: Packages
        script: flutter pub get
      - name: Tests (no release from failing code)
        script: flutter test
      - name: Keychain for signing
        script: keychain initialize
      - name: Certificate and App Store profile from Apple
        script: |
          # Through the API key: reuses the distribution certificate that matches
          # CERTIFICATE_PRIVATE_KEY and the App Store profile, creating them on the first build.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Certificate into the keychain
        script: keychain add-certificates
      - name: Signing profiles into the Xcode project
        script: xcode-project use-profiles
      - name: Build the signed .ipa
        script: |
          # The version (1.0.0) comes from pubspec.yaml; the build number must go up with every
          # upload, so it is Codemagic's own build counter.
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=API_BASE_URL=$API_BASE_URL \
            --export-options-plist=/Users/builder/export_options.plist
      - name: Check the .ipa exists
        script: |
          # Fail here, not silently at Publishing, if Flutter did not write the .ipa.
          ls -la build/ios/ipa/
          ls build/ios/ipa/*.ipa
    artifacts:
      # Absolute path, so it does not matter which folder Codemagic resolves artifacts from.
      - /Users/builder/clone/mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    # Upload to App Store Connect and TestFlight (private testing). It never submits to the
    # App Store: that is done by hand with "Submit for Review" in App Store Connect.
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  # Uploads the App Store screenshots (mobile/store/out/ios/1290x2796, iPhone 6.9" slot) to the
  # version being prepared in App Store Connect. Started by hand; changes only the screenshots and
  # never submits anything for review.
  ios-screenshots:
    name: iOS App Store screenshots
    instance_type: mac_mini_m2
    max_build_duration: 20
    working_directory: mobile
    integrations:
      app_store_connect: Raya App Store Connect
    environment:
      vars:
        APP_STORE_APP_ID: "6827759947"
    scripts:
      - name: Upload screenshots to App Store Connect
        script: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet pyjwt cryptography requests
          /tmp/venv/bin/python store/upload_screenshots.py "$APP_STORE_APP_ID" store/out/ios/1290x2796
